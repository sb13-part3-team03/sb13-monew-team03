spring:
  datasource:
    url: jdbc:h2:mem:monew;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        generate_statistics: true

naver:
  api:
    client-id: test-client-id
    client-secret: test-client-secret

cloud:
  aws:
    s3:
      bucket: test-bucket

logging:
  level:
    root: info
    com.codeit.monew: debug