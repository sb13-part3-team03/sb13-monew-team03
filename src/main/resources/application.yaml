spring:
  application:
    name: monew

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/monew}
    username: ${DB_USERNAME:monew_user}
    password: ${DB_PASSWORD:monew1234}
    driver-class-name: org.postgresql.Driver

  batch:
    jdbc:
      initialize-schema: always

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  profiles:
    active: dev

naver:
  api:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    base-url: https://naverapihub.apigw.ntruss.com
